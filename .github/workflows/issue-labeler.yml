name: Issue Labeler

on:
  issues:
    types: [opened, edited]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    
    steps:
      - name: Add firmware label
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            
            // Check for firmware type in the body using regex
            // Match both "### Firmware Type" and "**Firmware Type**" formats
            const firmwareMatch = body.match(/(?:###\s*Firmware\s*Type|Firmware\s*Type\*\*)\s*\n\s*(arkos4clone|darkos4clone)/i);
            
            if (firmwareMatch) {
              const label = firmwareMatch[1];
              // Add the label
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: [label]
              });
              console.log(`Added label: ${label}`);
            } else {
              console.log('No firmware type found in issue body');
              console.log('Body content:', body.substring(0, 500));
            }
