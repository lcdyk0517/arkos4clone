# Swap goes to zram (compressed RAM), not to the SD card: swapping is cheap,
# so swap out cold anonymous memory as readily as dropping file cache, and
# read back one page per fault instead of a cluster of eight.
vm.swappiness = 100
vm.page-cluster = 0

# Start background reclaim (kswapd) about 1.25% of RAM above the low
# watermark instead of 0.1%, so allocations during game loads rarely have to
# stop and reclaim memory themselves.
# (4.6 and later; "-" skips it on the 4.4 kernel)
-vm.watermark_scale_factor = 125
